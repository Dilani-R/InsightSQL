spring:
  application:
    name: insightsql

  datasource:
    url: ${NEON_DATABASE_URL}
    username: ${NEON_DATABASE_USERNAME}
    password: ${NEON_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000

server:
  port: 8080
